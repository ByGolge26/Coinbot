services:
  - type: web
    name: coinbot-v19
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: LIVE_TRADING
        value: "false"
      - key: LIVE_CONFIRM
        value: ""
      - key: DRY_RUN
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: COINBASE_API_KEY_NAME
        sync: false
      - key: COINBASE_API_PRIVATE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_MODEL
        value: "openai/gpt-oss-20b"
      - key: AI_FALLBACK_MODEL
        value: "openai/gpt-oss-20b"
      - key: AI_CANDIDATES
        value: "8"
      - key: AI_MIN_SCORE
        value: "70"
      - key: AI_CACHE_MINUTES
        value: "15"
      - key: SCAN_LIMIT
        value: "40"
      - key: SCAN_INTERVAL_SECONDS
        value: "300"
      - key: MIN_BUY_TRY
        value: "1000"
      - key: MIN_LOSS_TRY
        value: "100"
      - key: MIN_PROFIT_TRY
        value: "150"
      - key: MAX_DAILY_LOSS_TRY
        value: "200"
      - key: MAX_CONSECUTIVE_LOSSES
        value: "3"
      - key: LOSS_COOLDOWN_MINUTES
        value: "30"
      - key: POSITION_SIZE_PCT
        value: "0.25"
      - key: ACTIVE_CAPITAL_PCT
        value: "0.75"
      - key: MAX_OPEN_POSITIONS
        value: "20"
      - key: ALLOW_WITHOUT_AI
        value: "false"
