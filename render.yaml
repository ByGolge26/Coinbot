services:
  - type: web
    name: yatirim-botu-v17
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: STARTING_TRY_BALANCE
        value: "5000"
      - key: ENTRY_SCORE
        value: "4"
      - key: SCAN_LIMIT
        value: "40"
      - key: MAX_OPEN_POSITIONS
        value: "20"
      - key: POSITION_SIZE_PCT
        value: "0.25"
      - key: ACTIVE_CAPITAL_PCT
        value: "0.75"

      - key: MIN_BUY_TRY
        value: "1000"
      - key: MIN_LOSS_TRY
        value: "100"
      - key: MIN_PROFIT_TRY
        value: "150"
      - key: AI_MODEL
        value: "openai/gpt-oss-20b"
      - key: AI_FALLBACK_MODEL
        value: "openai/gpt-oss-20b"
      - key: AI_CANDIDATES
        value: "8"
      - key: AI_CACHE_MINUTES
        value: "15"
      - key: AI_MIN_SCORE
        value: "70"
      - key: SCAN_INTERVAL_SECONDS
        value: "600"
      - key: ALLOW_WITHOUT_AI
        value: "false"
